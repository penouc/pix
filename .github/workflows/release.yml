name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish macOS release
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must be a semantic version such as v0.2.0" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: |
          pnpm typecheck
          pnpm test

      - name: Build desktop
        run: pnpm build

      - name: Stage App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [[ -z "${APPLE_API_KEY_BASE64:-}" ]]; then
            echo "APPLE_API_KEY_BASE64 secret is required for notarization" >&2
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          chmod 600 "$KEY_PATH"

      - name: Package Apple Silicon release and update feed
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [[ -z "${CSC_LINK:-}" || -z "${CSC_KEY_PASSWORD:-}" ]]; then
            echo "CSC_LINK and CSC_KEY_PASSWORD secrets are required for Developer ID signing" >&2
            exit 1
          fi
          if [[ -z "${APPLE_API_KEY_ID:-}" || -z "${APPLE_API_ISSUER:-}" ]]; then
            echo "APPLE_API_KEY_ID and APPLE_API_ISSUER secrets are required for notarization" >&2
            exit 1
          fi
          pnpm --filter @pi-desktop/desktop exec electron-builder \
            --mac dmg zip \
            --arm64 \
            --config electron-builder.yml \
            --publish never \
            --config.extraMetadata.version="$VERSION" \
            --config.forceCodeSigning=true

      - name: Verify package
        run: pnpm verify:packaged

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            apps/desktop/release/*.dmg \
            apps/desktop/release/*.zip \
            apps/desktop/release/*.yml \
            apps/desktop/release/*.blockmap \
            --verify-tag \
            --title "PiX $GITHUB_REF_NAME" \
            --generate-notes
