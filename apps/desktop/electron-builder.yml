appId: dev.pi.agent.desktop
productName: PiX
copyright: Copyright © Pi Desktop

# `electron-updater` reads this from the packaged app and resolves updates from
# the release assets created by `.github/workflows/release.yml`.
publish:
  provider: github
  owner: penouc
  repo: pix

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

# Keep native / large Pi deps outside asar where possible.
asar: true
asarUnpack:
  - "**/*.node"
  - "**/node_modules/@earendil-works/**"
  - "**/node_modules/@silvia-odwyer/**"

extraMetadata:
  main: dist-electron/main/index.js

mac:
  category: public.app-category.developer-tools
  # Generated from build/icon-source.png by `pnpm icon:generate`.
  icon: build/icon.icns
  target:
    - target: dir
      arch:
        - arm64
    - target: dmg
      arch:
        - arm64
    # GitHub releases need a ZIP and latest-mac.yml for in-app updates; DMG
    # remains the friendlier first-install download.
    - target: zip
      arch:
        - arm64
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  # Uninstall: remove the .app bundle from /Applications, then the user data.
  # userData is pinned in Main to Application Support/@pi-desktop/desktop so
  # Dock productName ("PiX") cannot orphan existing projects. Packaged builds
  # share that path; `node scripts/verify-packaged.mjs` prints the real paths.

dmg:
  title: PiX
  window:
    width: 540
    height: 380

linux:
  icon: build/icon.png
  target:
    - target: dir
      arch:
        - x64

npmRebuild: false
nodeGypRebuild: false
