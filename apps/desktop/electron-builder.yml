appId: dev.pi.agent.desktop
productName: Pi Agent Desktop
copyright: Copyright © Pi Desktop

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

# Keep native / large Pi deps outside asar where possible.
asar: true
asarUnpack:
  - "**/*.node"
  - "**/node_modules/@earendil-works/**"
  - "**/node_modules/@silvia-odwyer/**"

extraMetadata:
  main: dist-electron/main/index.js

mac:
  category: public.app-category.developer-tools
  # Generated from build/icon.svg by `pnpm icon:generate`.
  icon: build/icon.icns
  target:
    - target: dir
      arch:
        - arm64
    - target: dmg
      arch:
        - arm64
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  # Uninstall: delete ~/Library/Application Support/Pi Agent Desktop
  # and remove the .app bundle from /Applications.

dmg:
  title: Pi Agent Desktop
  window:
    width: 540
    height: 380

linux:
  icon: build/icon.png
  target:
    - target: dir
      arch:
        - x64

npmRebuild: false
nodeGypRebuild: false
