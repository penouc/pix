appId: dev.pi.agent.desktop
productName: PiX
copyright: Copyright © Pi Desktop

# `electron-updater` reads this from the packaged app and resolves updates from
# the release assets created by `.github/workflows/release.yml`.
publish:
  provider: github
  owner: penouc
  repo: pix

directories:
  output: release
  buildResources: build

# Uniform artifact names so macOS and Windows ZIPs never collide on the same
# Release (plan: Windows support). DMG keeps its default name; NSIS overrides
# below so installers read as setup files.
artifactName: PiX-${version}-${os}-${arch}.${ext}

# Strip Electron's default Camera/Mic/Bluetooth privacy strings from every
# Info.plist before signing. See build/after-pack.mjs.
afterPack: build/after-pack.mjs

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

# Keep native / large Pi deps outside asar where possible.
asar: true
asarUnpack:
  - '**/*.node'
  - '**/node_modules/node-pty/**'
  - '**/node_modules/@earendil-works/**'
  - '**/node_modules/@silvia-odwyer/**'

extraMetadata:
  main: dist-electron/main/index.js

mac:
  category: public.app-category.developer-tools
  # Generated from build/icon-source.png by `pnpm icon:generate`.
  icon: build/icon.icns
  target:
    - target: dir
      arch:
        - arm64
    - target: dmg
      arch:
        - arm64
    # GitHub releases need a ZIP and latest-mac.yml for in-app updates; DMG
    # remains the friendlier first-install download.
    - target: zip
      arch:
        - arm64
  # Release CI signs with CSC_LINK (Developer ID Application). Local
  # package:* scripts override identity=null for unsigned smoke builds.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # electron-builder notarizes automatically when APPLE_API_KEY* (or
  # APPLE_ID + app-specific password) env vars are present. See
  # docs/macos-signing.md.
  notarize: true
  # Uninstall: remove the .app bundle from /Applications, then the user data.
  # userData is pinned in Main to Application Support/@pi-desktop/desktop so
  # Dock productName ("PiX") cannot orphan existing projects. Packaged builds
  # share that path; `node scripts/verify-packaged.mjs` prints the real paths.

dmg:
  title: PiX
  window:
    width: 540
    height: 380

# Windows x64 first release. electron-builder converts build/icon.png → .ico
# (PNG must be square and ≥256px; build/icon.png is 1024×1024). NSIS is the
# target electron-updater needs — latest.yml is only emitted for NSIS builds —
# and the zip is a portable, no-install download.
win:
  icon: build/icon.png
  # `win.artifactName` covers the zip; the NSIS block overrides with a setup
  # name below. Keeps every Windows artifact prefixed `PiX-…-windows-…`.
  artifactName: PiX-${version}-windows-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PiX
  # Per-user install (no admin/UAC); keep user data (projects, sessions,
  # provider keys) on uninstall so removing the app does not orphan work.
  deleteAppDataOnUninstall: false
  artifactName: PiX-${version}-windows-${arch}-setup.${ext}

linux:
  icon: build/icon.png
  target:
    - target: dir
      arch:
        - x64

npmRebuild: false
nodeGypRebuild: false
